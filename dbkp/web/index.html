<!DOCTYPE html>
<!-- ============================================================================
     dbkp Web 控制台（单文件；零构建、零外部依赖）
     只依赖 bkd 暴露的 /api/*。打开 http://127.0.0.1:8080/ 即可使用。
   ==========================================================================-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbkp 备份控制台</title>
<style>
  :root { --bg:#0f1720; --card:#18222e; --line:#26374a; --fg:#e6edf3;
          --dim:#8ba0b6; --ok:#2ecc71; --err:#ff6b6b; --run:#3fa7ff; --warn:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; letter-spacing:.5px; }
  header .sp { flex:1; }
  main { padding:18px 20px 40px; display:grid; gap:18px;
         grid-template-columns: minmax(320px,430px) minmax(0,1fr); }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:15px; color:var(--dim); font-weight:600; }
  label { display:block; margin:8px 0 3px; font-size:12px; color:var(--dim); }
  input, select { width:100%; padding:7px 9px; border-radius:6px;
         border:1px solid var(--line); background:#101922; color:var(--fg); font:inherit; }
  input:focus, select:focus { outline:none; border-color:var(--run); }
  .row { display:flex; gap:10px; } .row > div { flex:1; }
  button { background:var(--run); color:#04121f; border:0; border-radius:6px;
           padding:8px 14px; font-weight:600; cursor:pointer; font:inherit; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:hover:not(:disabled) { filter:brightness(1.12); }
  .bar { height:8px; background:#0c1420; border-radius:5px; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; width:0; background:var(--run); transition:width .35s; }
  .job { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .job .t { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag { font-size:11px; padding:1px 7px; border-radius:10px; border:1px solid var(--line); color:var(--dim); }
  .s-running { color:var(--run); } .s-succeeded { color:var(--ok); }
  .s-failed { color:var(--err); } .s-canceled { color:var(--warn); } .s-queued { color:var(--dim); }
  .meta { color:var(--dim); font-size:12px; margin-top:4px; word-break:break-all; }
  pre.log { background:#0a121b; border:1px solid var(--line); border-radius:6px; padding:8px;
            max-height:190px; overflow:auto; font-size:12px; white-space:pre-wrap; margin:8px 0 0; }
  .hide { display:none; }
  input[type=checkbox] { width:auto; display:inline-block; margin-right:6px; }
  #toast { position:fixed; right:16px; bottom:16px; background:#0c1420; border:1px solid var(--line);
           border-left:3px solid var(--run); padding:10px 14px; border-radius:6px; opacity:0;
           transition:opacity .25s; max-width:430px; }
  #toast.show { opacity:1; } #toast.err { border-left-color:var(--err); }
</style>
</head>
<body>
<header>
  <h1>dbkp 备份控制台</h1>
  <span class="meta" id="status">连接中…</span>
  <span class="sp"></span>
  <span class="meta" id="cap"></span>
  <button class="ghost" id="btnRefresh">刷新任务</button>
  <button class="ghost" id="btnLogout">退出</button>
</header>

<main>
  <!-- 拿到 token 之前，服务端只放行 /api/info 与 /api/login -->
  <section class="card" id="loginCard">
    <h2>登录</h2>
    <label>服务口令（服务端未配置口令时可直接进入）</label>
    <input type="password" id="password" placeholder="••••••">
    <div style="margin-top:12px"><button id="btnLogin">登录</button></div>
  </section>

  <section class="card hide" id="taskCard">
    <h2>新建任务</h2>
    <div class="row">
      <div><label>类型</label>
        <select id="type">
          <option value="backup">备份 backup</option>
          <option value="restore">还原 restore</option>
          <option value="verify">校验 verify</option>
        </select></div>
      <div><label>形态（备份时有效）</label>
        <select id="mode">
          <option value="auto">auto 自动判断</option>
          <option value="archive">archive 单文件归档</option>
          <option value="copy">copy 逐文件复制</option>
        </select></div>
    </div>
    <label>来源 source（备份=源目录；还原/校验=归档或备份目录）</label>
    <input id="source" placeholder="D:/data/docs">
    <label>目标 destination（以 .dbkp 结尾=归档；否则=目标目录）</label>
    <input id="destination" placeholder="D:/backup/docs.dbkp">
    <div class="row">
      <div><label>压缩算法</label><select id="algorithm"></select></div>
      <div><label>加密算法</label>
        <select id="crypto"><option value="none">none 不加密</option>
          <option value="aes256">AES-256-CBC</option><option value="chacha20">ChaCha20</option></select></div>
      <div><label>校验和</label><select id="checksum">
          <option value="crc64">CRC64</option><option value="sha256">SHA-256</option>
          <option value="none">none</option></select></div>
    </div>
    <label>密码（加密算法非 none 时必填）</label>
    <input type="password" id="jobPassword">
    <label>排除模式（逗号分隔 glob，等价于命令行 --exclude）</label>
    <input id="exclude" placeholder="*.tmp, cache/*">
    <div class="row" style="margin-top:10px">
      <div><label><input type="checkbox" id="preserveMeta" checked> 保留元数据</label></div>
      <div><label><input type="checkbox" id="verifyAfter" checked> 备份后校验</label></div>
      <div><label><input type="checkbox" id="overwrite"> 允许覆盖</label></div>
    </div>
    <label>任务名（留空则自动用 类型:来源）</label>
    <input id="label">
    <div style="margin-top:14px"><button id="btnSubmit">提交任务</button></div>
  </section>

  <section class="card">
    <h2>任务列表 <span class="meta" id="jobHint">（SSE 实时进度）</span></h2>
    <div id="jobs"><div class="meta">还没有任务。</div></div>
    <div class="row" style="margin-top:10px">
      <div>
        <label>查看已有归档（.dbkp 路径）</label>
        <input id="statPath" placeholder="D:/backup/docs.dbkp">
      </div>
      <div style="flex:0 0 auto;display:flex;align-items:flex-end">
        <button class="ghost" id="btnStat">读卷标</button>
      </div>
    </div>
    <pre class="log hide" id="statOut"></pre>
  </section>

</main>
<div id="toast"></div>
<script>
'use strict';
/* ------------------------------------------------------------------ 基础设施 */
const $ = (id) => document.getElementById(id);
let TOKEN = sessionStorage.getItem('dbkp.token') || '';
let ES = null;                       // EventSource
let LAST_REVISION = 0;

function toast(text, isErr) {
  const t = $('toast');
  t.textContent = text;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = ''; }, 4200);
}

async function api(path, opts) {
  const o = Object.assign({ headers: {} }, opts || {});
  if (TOKEN) o.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (o.body && !o.headers['Content-Type']) o.headers['Content-Type'] = 'application/json';
  const resp = await fetch(path, o);
  const text = await resp.text();
  let json = null;
  try { json = JSON.parse(text); } catch (e) { /* 静态页/404 不是 JSON */ }
  if (resp.status === 401) { TOKEN = ''; sessionStorage.removeItem('dbkp.token'); showLogin('登录已过期，请重新登录'); }
  if (!resp.ok || (json && json.code !== 0 && resp.status !== 200)) {
    const msg = (json && json.msg) ? json.msg : ('HTTP ' + resp.status + ' ' + text.slice(0, 120));
    throw new Error(msg);
  }
  return json;
}

function showLogin(msg) {
  $('loginCard').classList.remove('hide');
  $('taskCard').classList.add('hide');
  $('status').textContent = msg || '未登录';
  if (ES) { ES.close(); ES = null; }
}

function showApp(info) {
  $('loginCard').classList.add('hide');
  $('taskCard').classList.remove('hide');
  $('status').textContent = '已连接 ' + (info.app || 'dbkp') + ' api ' + (info.apiVersion || '?')
    + ' / ' + (info.capabilities ? info.capabilities.os : '');
  $('cap').textContent = info.capabilities
    ? ('软链 ' + yn(info.capabilities.symlink) + ' · 硬链 ' + yn(info.capabilities.hardlink)
       + ' · 属主 ' + yn(info.capabilities.owner)) : '';
}
const yn = (b) => b ? '✓' : '✗';

/* ------------------------------------------------------------------- 启动 */
async function boot() {
  let info;
  try { info = (await api('/api/info')).data; }
  catch (e) { showLogin('无法连接服务：' + e.message); return; }
  if (TOKEN) {
    try { const cfg = (await api('/api/config')).data; showApp(info); applyConfig(cfg); refreshJobs(); return; }
    catch (e) { /* token 失效，走登录 */ }
  }
  if (!info.authRequired) {
    const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: '' }) });
    TOKEN = r.data.token; sessionStorage.setItem('dbkp.token', TOKEN);
    showApp(info); applyConfig((await api('/api/config')).data); refreshJobs();
  } else {
    showLogin(info.authRequired ? '需要登录' : '未登录');
  }
}

async function doLogin() {
  try {
    const r = await api('/api/login', {
      method: 'POST', body: JSON.stringify({ password: $('password').value })
    });
    TOKEN = r.data.token;
    sessionStorage.setItem('dbkp.token', TOKEN);
    const info = (await api('/api/info')).data;
    showApp(info);
    applyConfig((await api('/api/config')).data);
    refreshJobs();
    toast('登录成功，令牌有效期 ' + Math.round((r.data.expiresIn || 0) / 3600) + ' 小时');
  } catch (e) { toast('登录失败：' + e.message, true); }
}

function applyConfig(cfg) {
  const sel = $('algorithm');
  sel.innerHTML = '';
  (cfg.algorithms || []).forEach((a) => {
    const op = document.createElement('option');
    op.value = a; op.textContent = a;
    if (a === cfg.defaultAlgorithm) op.selected = true;
    sel.appendChild(op);
  });
  if (cfg.defaultSource && !$('source').value) $('source').value = cfg.defaultSource;
  if (cfg.defaultDestination && !$('destination').value) $('destination').value = cfg.defaultDestination;
  window.CFG = cfg;
}

$('btnLogin').onclick = doLogin;
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('btnLogout').onclick = () => { TOKEN = ''; sessionStorage.removeItem('dbkp.token'); showLogin('已退出'); };
$('btnRefresh').onclick = refreshJobs;

/* ------------------------------------------------------------------ 提交任务 */
function buildBody() {
  const type = $('type').value;
  const body = {
    type, label: $('label').value,
    source: $('source').value.trim(),
    destination: $('destination').value.trim(),
    password: $('jobPassword').value,
    preserveMeta: $('preserveMeta').checked,
    verifyAfter: $('verifyAfter').checked,
    overwrite: $('overwrite').checked
  };
  if (type === 'backup') {
    body.mode = $('mode').value;
    body.algorithm = $('algorithm').value;
    body.crypto = $('crypto').value;
    body.checksum = $('checksum').value;
    const ex = $('exclude').value.split(',').map(s => s.trim()).filter(Boolean);
    if (ex.length) body.filter = { excludePaths: ex };
  }
  return body;
}

async function submitJob() {
  $('btnSubmit').disabled = true;
  try {
    const r = await api('/api/jobs', { method: 'POST', body: JSON.stringify(buildBody()) });
    toast('任务 #' + r.data.id + ' 已受理（' + r.data.mode + '）');
    watchJob(r.data.id);
    refreshJobs();
  } catch (e) { toast('提交失败：' + e.message, true); }
  $('btnSubmit').disabled = false;
}

/* ------------------------------------------------------------------ 列表与进度 */
const fmtBytes = (n) => {
  if (!n) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(v >= 100 ? 0 : 1) + ' ' + u[i];
};

function renderJobs(list) {
  const box = $('jobs');
  if (!list || !list.length) { box.innerHTML = '<div class="meta">还没有任务。</div>'; return; }
  box.innerHTML = '';
  list.forEach((j) => box.appendChild(renderJob(j)));
}

function renderJob(j) {
  const d = document.createElement('div');
  d.className = 'job';
  d.dataset.id = j.id;
  const pct = Math.round((j.ratio || 0) * 100);
  const done = j.state === 'succeeded' || j.state === 'failed' || j.state === 'canceled';
  d.innerHTML =
    '<div class="t"><b class="s-' + j.state + '">' + j.state + '</b>' +
    '<span class="tag">' + j.type + '</span>' +
    '<span class="tag">#' + j.id + '</span>' +
    '<span style="flex:1"></span>' +
    (done ? '' : '<button class="ghost" data-act="cancel">取消</button> ') +
    '<button class="ghost" data-act="watch">' + (j.state === 'running' ? '实时进度' : '日志') + '</button>' +
    '</div><div class="meta">' + escapeHtml(j.label || '') + '</div>' +
    '<div class="meta">' + escapeHtml(j.source) + ' → ' + escapeHtml(j.target) + '</div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="meta">' + (j.entriesDone || 0) + '/' + (j.totalEntries || '?') + ' 条 · ' +
    fmtBytes(j.bytesDone) + ' / ' + fmtBytes(j.totalBytes) + ' · ' + pct + '% · ' +
    escapeHtml(j.message || '') + '</div>';
  d.querySelectorAll('button').forEach((b) => {
    b.onclick = () => b.dataset.act === 'cancel' ? cancelJob(j.id) : watchJob(j.id);
  });
  return d;
}
const escapeHtml = (s) => String(s || '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function refreshJobs() {
  if (!TOKEN) return;
  try {
    const r = await api('/api/jobs?limit=20');
    renderJobs(r.data.jobs);
  } catch (e) { /* 401 已在 api() 里处理 */ }
}

async function cancelJob(id) {
  try { const r = await api('/api/jobs/' + id + '/cancel', { method: 'POST', body: '{}' }); toast(r.msg); }
  catch (e) { toast('取消失败：' + e.message, true); }
}

/* --------------------------------------------------------------- SSE 进度流 */
function watchJob(id) {
  if (ES) ES.close();
  const url = '/api/events?token=' + encodeURIComponent(TOKEN) + '&job=' + id;
  ES = new EventSource(url);
  $('jobHint').textContent = '（正在跟踪任务 #' + id + '）';
  ES.addEventListener('tick', (ev) => {
    const p = JSON.parse(ev.data);
    if (p.job) applyJob(p.job);
  });
  ES.addEventListener('done', (ev) => {
    const p = JSON.parse(ev.data);
    if (p.job) { applyJob(p.job); toast('任务 #' + p.job.id + ' ' + p.job.state + '：' + (p.job.message || '')); }
    ES.close(); ES = null; $('jobHint').textContent = '（SSE 已结束）';
    refreshJobs();
  });
  ES.onerror = () => { ES.close(); ES = null; $('jobHint').textContent = '（SSE 断开，可用“刷新任务”）'; };
}

/* 就地更新单个任务卡片：整块列表重绘会让滚动位置跳掉 */
function applyJob(job) {
  const box = $('jobs');
  let card = box.querySelector('.job[data-id="' + job.id + '"]');
  if (!card) return refreshJobs();
  const tmp = renderJob(job);
  card.innerHTML = tmp.innerHTML;
  card.querySelectorAll('button').forEach((b) => {
    b.onclick = () => b.dataset.act === 'cancel' ? cancelJob(job.id) : watchJob(job.id);
  });
}

async function readStat() {
  const path = $('statPath').value.trim();
  if (!path) { toast('先填归档路径', true); return; }
  try {
    const r = await api('/api/stat?path=' + encodeURIComponent(path));
    const d = r.data;
    $('statOut').classList.remove('hide');
    $('statOut').textContent =
      '归档: ' + d.path + '\n算法: ' + d.algorithm + '   加密: ' + d.crypto +
      '\n条目: ' + d.fileCount + ' (目录 ' + d.dirCount + ', 链接 ' + d.linkCount + ')' +
      '\n原始: ' + fmtBytes(d.rawBytes) + ' → 存成: ' + fmtBytes(d.storedBytes) +
      '   压缩比: ' + ((d.ratio || 1) * 100).toFixed(1) + '%' +
      '\nCRC: ' + d.payloadCrc + '   创建于: ' + new Date(d.createTime * 1000).toLocaleString() +
      '\n源路径: ' + d.sourcePath + '\n备注: ' + d.comment;
  } catch (e) { toast('读取失败：' + e.message, true); }
}

$('btnSubmit').onclick = submitJob;
$('btnStat').onclick = readStat;
/* 每 5 秒兜底刷新一次：SSE 只有 25 秒生命周期，浏览器会自动重连，
   但列表页还是要有个稳定节奏，避免事件丢失后数字长期不动。 */
setInterval(() => { if (TOKEN) refreshJobs(); }, 5000);
boot();

</script>
</body>
</html>
